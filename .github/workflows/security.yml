# シークレット・依存脆弱性のスキャン（GHAS 解約後の代替）。
#
# * gitleaks    … コミット履歴へのシークレット混入（GHAS secret scanning の代わり）。
#                 除外設定はリポジトリ直下の .gitleaks.toml（あれば）
# * osv-scanner … ロックファイルの既知脆弱性。ロックファイルが無ければ何もしない
#
# ツールは版と SHA-256 を固定した公式リリースバイナリをジョブ内で取得する
# （arm64 / x64 どちらのランナーでも同じ版で動かすため）。版を上げるときは
# 公式の checksums ファイルから値を差し替える。
# Semgrep（SAST）は公式イメージを digest 固定で入れる方針のため別 PR で追加する。
#
# 公開リポジトリなので GitHub ホストランナー（無料）で動かす。セルフホストランナーは
# フォークからの PR で任意コードを実行されうるため使わない。secrets 不使用・contents: read のみ。
name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0"   # 毎週月曜 03:17 JST に履歴全体を検査
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 週次の履歴全体スキャンが main への push で打ち切られないよう、イベント種別ごとに分ける
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
  OSV_VERSION: 2.7.1
  OSV_SHA256_AMD64: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
  OSV_SHA256_ARM64: 983d22fbad9724514e3fcc6acc83b5fa64c5ffa6b0d9f510028f22c1b223ff81

jobs:
  scan:
    name: gitleaks / osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # gitleaks が履歴を見るため

      - name: Install tools (pinned + checksum)
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/bin"; mkdir -p "$BIN"; cd "$RUNNER_TEMP"
          case "$(uname -m)" in
            x86_64)        GL_ARCH=x64;   GL_SHA=$GITLEAKS_SHA256_X64;   OSV_ARCH=amd64; OSV_SHA=$OSV_SHA256_AMD64 ;;
            aarch64|arm64) GL_ARCH=arm64; GL_SHA=$GITLEAKS_SHA256_ARM64; OSV_ARCH=arm64; OSV_SHA=$OSV_SHA256_ARM64 ;;
            *) echo "::error::未対応のアーキテクチャ $(uname -m)"; exit 1 ;;
          esac

          GL_TGZ="gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          curl -fsSLo "$GL_TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GL_TGZ}"
          echo "${GL_SHA}  ${GL_TGZ}" | sha256sum -c -
          tar -xzf "$GL_TGZ" -C "$BIN" gitleaks

          OSV_BIN="osv-scanner_linux_${OSV_ARCH}"
          curl -fsSLo "$OSV_BIN" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/${OSV_BIN}"
          echo "${OSV_SHA}  ${OSV_BIN}" | sha256sum -c -
          install -m 0755 "$OSV_BIN" "$BIN/osv-scanner"

          echo "$BIN" >> "$GITHUB_PATH"

      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks git --redact --verbose
          fi

      # PR では「この PR で新しく増えた脆弱性」だけで失敗させる（既存の脆弱性では止めない）。
      # main への push と週次の定期実行では、残っている脆弱性があれば失敗させる。
      - name: osv-scanner
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e -uo pipefail   # 終了コードを自分で判定するため -e を外す
          # 終了コード: 0 = 脆弱性なし / 1 = 脆弱性あり / 128 = スキャン対象（ロックファイル等）なし / それ以外 = エラー
          scan() {
            osv-scanner scan source -r --format json "$1" > "$2"
            local rc=$?
            case "$rc" in
              0|1) ;;
              128) echo '{"results":[]}' > "$2" ;;
              *) echo "::error::osv-scanner が失敗しました（終了コード $rc）"; exit "$rc" ;;
            esac
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            osv-scanner scan source -r .
            rc=$?
            if [ "$rc" -eq 128 ]; then echo "ロックファイルが無いためスキップ"; exit 0; fi
            exit "$rc"
          fi

          command -v python3 >/dev/null || { echo "::error::ランナーに python3 がありません"; exit 1; }
          # 比較の基準は「checkout した merge commit の 1 つ目の親」＝今のベース。
          # github.event.pull_request.base.sha はベースが進んでも古いままのことがあり、そのまま使うと
          # 後からベースに入った他の PR の変更まで「この PR の差分」に数えてしまう
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then BASE=$(git rev-parse HEAD^1); else BASE="$BASE_SHA"; fi
          scan . "$RUNNER_TEMP/osv-head.json"
          # 変更前（base）の状態を別ディレクトリに取り出して同じようにスキャンする。
          # ランナーは作業ディレクトリを使い回すので、前回の残り（キャンセルで後片付けが走らなかった
          # ディレクトリと登録）を掃除してから作り、終わったら（キャンセルされても）消す。
          rm -rf "$RUNNER_TEMP"/osv-base-*
          git worktree prune
          BASE_DIR="$RUNNER_TEMP/osv-base-$GITHUB_RUN_ID"
          cleanup() { git worktree remove --force "$BASE_DIR" >/dev/null 2>&1; rm -rf "$BASE_DIR"; git worktree prune; }
          trap cleanup EXIT
          trap 'cleanup; exit 130' INT TERM
          git worktree add --force --detach "$BASE_DIR" "$BASE" >/dev/null || { echo "::error::base（$BASE）を取り出せませんでした"; exit 1; }
          scan "$BASE_DIR" "$RUNNER_TEMP/osv-base.json"

          python3 - "$RUNNER_TEMP/osv-base.json" "$RUNNER_TEMP/osv-head.json" <<'PY'
          import json, sys

          def vulns(path):
              found = {}
              for result in json.load(open(path)).get("results") or []:
                  for pkg in result.get("packages") or []:
                      p = pkg.get("package", {})
                      for v in pkg.get("vulnerabilities") or []:
                          key = (p.get("ecosystem", ""), p.get("name", ""), v.get("id", ""))
                          found[key] = p.get("version", "")
              return found

          base, head = vulns(sys.argv[1]), vulns(sys.argv[2])
          new = sorted(set(head) - set(base))
          fixed = len(set(base) - set(head))
          print(f"既存の脆弱性: {len(set(head) & set(base))} 件（この PR では止めない） / この PR で解消: {fixed} 件")
          if not new:
              print("この PR で新しく増えた脆弱性はありません")
              sys.exit(0)
          print(f"::error::この PR で新しく増えた脆弱性: {len(new)} 件")
          for eco, name, vid in new:
              print(f"  {eco} {name}@{head[(eco, name, vid)]}  {vid}  https://osv.dev/vulnerability/{vid}")
          sys.exit(1)
          PY
